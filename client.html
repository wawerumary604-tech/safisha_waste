<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Dashboard — Safisha</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="dashboard-body">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="logo-icon"><i class="fa-solid fa-recycle"></i></span>
      <span class="logo-text">Safisha</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" onclick="showPanel('overview', this)">
        <span class="nav-icon"><i class="fa-solid fa-house"></i></span><span>Overview</span>
      </a>
      <a href="#" class="nav-item" onclick="showPanel('post', this)">
        <span class="nav-icon"><i class="fa-solid fa-plus"></i></span><span>Post Garbage</span>
      </a>
      <a href="#" class="nav-item" onclick="showPanel('myposts', this)">
        <span class="nav-icon"><i class="fa-solid fa-list-check"></i></span><span>My Posts</span>
      </a>
      <a href="#" class="nav-item" onclick="showPanel('profile', this)">
        <span class="nav-icon"><i class="fa-solid fa-user"></i></span><span>Profile</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-outline btn-full" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-wrapper">
    <!-- TOP BAR -->
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div class="topbar-title" id="topbar-title">Overview</div>
      <div class="topbar-user">
        <div class="avatar" id="client-avatar">C</div>
        <span id="client-name-top">Client</span>
      </div>
    </header>

    <!-- PANELS -->
    <main class="content">

      <!-- OVERVIEW PANEL -->
      <div class="panel active" id="panel-overview">
        <h2 class="panel-title">Welcome back, <span id="welcome-name">Client</span> <i class="fa-solid fa-hand-wave"></i></h2>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-card-icon" style="background:#e8f5e9"><i class="fa-solid fa-trash-can"></i></div>
            <div>
              <div class="stat-card-num" id="stat-total">0</div>
              <div class="stat-card-label">Total Posts</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:#fff3e0"><i class="fa-solid fa-clock"></i></div>
            <div>
              <div class="stat-card-num" id="stat-pending">0</div>
              <div class="stat-card-label">Pending</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:#e3f2fd"><i class="fa-solid fa-truck"></i></div>
            <div>
              <div class="stat-card-num" id="stat-collected">0</div>
              <div class="stat-card-label">Collected</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-card-icon" style="background:#fce4ec"><i class="fa-solid fa-industry"></i></div>
            <div>
              <div class="stat-card-num" id="stat-facility">0</div>
              <div class="stat-card-label">At Facility</div>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h3>Recent Activity</h3>
          <div id="recent-activity" class="activity-list">
            <div class="empty-state">No activity yet. Post your first garbage request!</div>
          </div>
        </div>
      </div>

      <!-- POST GARBAGE PANEL -->
      <div class="panel" id="panel-post">
        <h2 class="panel-title">Post Garbage Request</h2>
        <div class="form-card">
          <form id="post-form" onsubmit="handlePostGarbage(event)">
            <div class="form-row">
              <div class="form-group">
                <label>Waste Type</label>
                <select id="waste-type" required>
                  <option value="">-- Select waste type --</option>
                  <option value="Household Waste">Household Waste</option>
                  <option value="Recyclables">Recyclables (paper, plastic, metal)</option>
                  <option value="Organic Waste">Organic / Food Waste</option>
                  <option value="Electronics">Electronics (e-waste)</option>
                  <option value="Construction Debris">Construction Debris</option>
                  <option value="Hazardous Waste">Hazardous Waste</option>
                  <option value="Bulk Items">Bulk Items (furniture etc.)</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label>Estimated Weight</label>
                <select id="waste-weight" required>
                  <option value="">-- Select weight --</option>
                  <option value="Less than 10kg">Less than 10 kg</option>
                  <option value="10-50kg">10 – 50 kg</option>
                  <option value="50-200kg">50 – 200 kg</option>
                  <option value="200kg-1ton">200 kg – 1 ton</option>
                  <option value="Over 1 ton">Over 1 ton</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>Pickup Location</label>
              <input type="text" id="waste-location" placeholder="e.g. 14 Moi Avenue, Westlands, Nairobi" required />
            </div>

            <div class="form-group">
              <label>Description</label>
              <textarea id="waste-desc" rows="3" placeholder="Describe the waste — bags, loose, bins, etc. Any special instructions for the driver..." required></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Preferred Pickup Date</label>
                <input type="date" id="waste-date" required />
              </div>
              <div class="form-group">
                <label>Preferred Time</label>
                <select id="waste-time" required>
                  <option value="">-- Select time slot --</option>
                  <option value="Morning (6am-12pm)">Morning (6am – 12pm)</option>
                  <option value="Afternoon (12pm-5pm)">Afternoon (12pm – 5pm)</option>
                  <option value="Evening (5pm-8pm)">Evening (5pm – 8pm)</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>Urgency</label>
              <div class="urgency-options">
                <label class="urgency-label">
                  <input type="radio" name="urgency" value="Low" />
                  <span><i class="fa-solid fa-circle-dot" style="color:#16a34a"></i> Low</span>
                </label>
                <label class="urgency-label">
                  <input type="radio" name="urgency" value="Medium" checked />
                  <span><i class="fa-solid fa-circle-dot" style="color:#d97706"></i> Medium</span>
                </label>
                <label class="urgency-label">
                  <input type="radio" name="urgency" value="High" />
                  <span><i class="fa-solid fa-circle-dot" style="color:#dc2626"></i> High</span>
                </label>
              </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">
              <i class="fa-solid fa-paper-plane"></i> Submit Request
            </button>
          </form>
        </div>
      </div>

      <!-- MY POSTS PANEL -->
      <div class="panel" id="panel-myposts">
        <div class="panel-header-row">
          <h2 class="panel-title">My Garbage Posts</h2>
          <select id="filter-status" onchange="renderMyPosts()" class="filter-select">
            <option value="all">All Status</option>
            <option value="Pending">Pending</option>
            <option value="Accepted">Accepted</option>
            <option value="Collected">Collected</option>
            <option value="At Facility">At Facility</option>
          </select>
        </div>
        <div id="my-posts-list" class="posts-grid"></div>
      </div>

      <!-- PROFILE PANEL -->
      <div class="panel" id="panel-profile">
        <h2 class="panel-title">My Profile</h2>
        <div class="profile-card">
          <div class="profile-avatar" id="profile-avatar-big">C</div>
          <div class="profile-info">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="profile-name" readonly />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="profile-email" readonly />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="profile-phone" readonly />
            </div>
            <div class="form-group">
              <label>Location</label>
              <input type="text" id="profile-location" readonly />
            </div>
            <div class="form-group">
              <label>Account Type</label>
              <input type="text" value="Client" readonly />
            </div>
            <div class="form-group">
              <label>Member Since</label>
              <input type="text" id="profile-since" readonly />
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <div class="toast" id="toast"></div>
  <script src="js/app.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
